[project]
name = "supply-twin"
version = "0.1.0"
description = "Discrete-event digital twin of a retail chain that tests replenishment, promotion and fleet strategies over many seeds before rollout"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "simpy>=4.1",
]

[project.scripts]
supply-twin = "supply_twin.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_twin"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
