cks","key":"z=1.28 review=1d cover=1d trucks-4 promo_aware=no","total_cost":2382876.586380764,"cost_vs_current":-77203.65180347726,"cost_vs_current_ci_half":3070.429307758721,"fill_rate":0.9975728905268993,"promo_fill_rate":0.9838544077939653,"truck_utilisation":0.9070938965796217,"load_fill":0.6386038544115243,"beats_current":true},{"strategy":"fleet +4 trucks","key":"z=1.28 review=1d cover=1d trucks+4 promo_aware=no","total_cost":2547522.4662103252,"cost_vs_current":87442.2280260841,"cost_vs_current_ci_half":2690.8272048299405,"fill_rate":0.9986804372812748,"promo_fill_rate":0.9845218470976653,"truck_utilisation":0.6845966282923516,"load_fill":0.6531027655574333,"beats_current":false}],"stores":[{"store":"S000","dc":"DC1","km":114.1,"index":0},{"store":"S001","dc":"DC1","km":143.0,"index":1},{"store":"S002","dc":"DC1","km":35.7,"index":2},{"store":"S003","dc":"DC1","km":80.1,"index":3},{"store":"S004","dc":"DC1","km":105.3,"index":4},{"store":"S005","dc":"DC1","km":41.7,"index":5},{"store":"S006","dc":"DC1","km":161.3,"index":6},{"store":"S007","dc":"DC1","km":99.8,"index":7},{"store":"S008","dc":"DC1","km":185.8,"index":8},{"store":"S009","dc":"DC1","km":76.2,"index":9},{"store":"S010","dc":"DC1","km":59.2,"index":10},{"store":"S011","dc":"DC1","km":106.3,"index":11},{"store":"S012","dc":"DC1","km":142.0,"index":12},{"store":"S013","dc":"DC1","km":84.1,"index":13},{"store":"S014","dc":"DC1","km":116.7,"index":14},{"store":"S015","dc":"DC1","km":106.3,"index":15},{"store":"S016","dc":"DC1","km":104.5,"index":16},{"store":"S017","dc":"DC1","km":34.0,"index":17},{"store":"S018","dc":"DC1","km":84.2,"index":18},{"store":"S019","dc":"DC1","km":32.8,"index":19},{"store":"S020","dc":"DC2","km":62.5,"index":20},{"store":"S021","dc":"DC2","km":23.7,"index":21},{"store":"S022","dc":"DC2","km":135.7,"index":22},{"store":"S023","dc":"DC2","km":62.4,"index":23},{"store":"S024","dc":"DC2","km":126.9,"index":24},{"store":"S025","dc":"DC2","km":81.1,"index":25},{"store":"S026","dc":"DC2","km":122.4,"index":26},{"store":"S027","dc":"DC2","km":151.5,"index":27},{"store":"S028","dc":"DC2","km":101.3,"index":28},{"store":"S029","dc":"DC2","km":64.6,"index":29},{"store":"S030","dc":"DC2","km":136.2,"index":30},{"store":"S031","dc":"DC2","km":79.6,"index":31},{"store":"S032","dc":"DC2","km":96.1,"index":32},{"store":"S033","dc":"DC2","km":85.3,"index":33},{"store":"S034","dc":"DC2","km":50.6,"index":34},{"store":"S035","dc":"DC2","km":78.0,"index":35}],"trucks_per_dc":{"DC1":15,"DC2":11},"runtime_seconds":12.3}; /* SHEET:END */

          const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

            const base = r === cur;

          rows.forEach((_, i) => {
            tl.fromTo("#va-r" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.3 + i * 0.28);
            tl.fromTo("#va-v" + i, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.45 + i * 0.28);
          });
          tl.fromTo("#va-totals", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          tl.fromTo(["#va-desk", "#va-lab-desk", "#va-map", "#va-lab-map"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          tl.fromTo("#va-person", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo(["#va-roads", "#va-stores", "#va-DC1", "#va-DC2"], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.5);
          // the planner picks the best passing change from the sheet
          const PK = 4.0;
          tl.to("#va-t" + pickIdx, { opacity: 1, duration: 0.3 }, PK);
          tl.fromTo("#va-pick", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, PK + 0.3);
          tl.fromTo(["#va-m1", "#va-m2", "#va-day"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, PK + 0.9);
          // replay the change's review stagger: store s orders on day d when (d + s) % review_days == 0
          const review = 2, DAY0 = PK + 1.2, DAYLEN = 1.4, DAYS = 4;
          const dayEl = document.getElementById("va-day");
          const dv = { v: 0 };
          tl.to(dv, { v: DAYS - 0.001, duration: DAYS * DAYLEN, ease: "none", onUpdate: () => { dayEl.textContent = "DAY " + (1 + Math.floor(dv.v)); } }, DAY0);
          for (let d = 0; d < DAYS; d++) {
            const t = DAY0 + d * DAYLEN;
            Object.entries(STORE).forEach(([idx, s], j) => {
              if ((d + Number(idx)) % review) return;
              tl.fromTo(s.trip, { attr: { opacity: 0 } }, { attr: { opacity: 0.85 }, duration: 0.25 }, t + (j % 9) * 0.03);
              tl.to(s.trip, { attr: { opacity: 0 }, duration: 0.35 }, t + DAYLEN - 0.4);
              tl.fromTo(s.ok, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, t + 0.35 + (j % 9) * 0.03);
              if (d < DAYS - 1) tl.to(s.ok, { attr: { opacity: 0 }, duration: 0.3 }, t + DAYLEN - 0.35);
            });
          }
          tl.fromTo("#va-m1f", { scaleX: cur.load_fill }, { scaleX: pr.load_fill, duration: 1.4, ease: "power2.inOut" }, DAY0 + 0.4);
          tl.fromTo("#va-m2f", { scaleX: cur.promo_fill_rate }, { scaleX: pr.promo_fill_rate, duration: 1.4, ease: "power2.inOut" }, DAY0 + 0.8);
          tl.fromTo("#va-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.4);
          // all text fades fully out before the wipe, so no two slides' text is ever on screen together
          tl.to(["#va-kick", "#va-ttl", "#va-ul", "#va-sub", "#va-sheet", "#va-lab-desk", "#va-desk", "#va-pick", "#va-person", "#va-map", "#va-lab-map", "#va-day", "#va-svg", "#va-m1", "#va-m2", "#va-caption"], { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 1.05);
          // wipe out (white -> dark), revealing the next dark scene underneath
          tl.to("#va-page", { clipPath: "inset(0px 0px 0px 100%)", duration: 0.7, ease: "power3.inOut" }, D - 0.7);
          tl.fromTo("#va-edge", { x: 0, opacity: 0 }, { x: 1920, opacity: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, D - 0.7);
          window.__timelines["value"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
