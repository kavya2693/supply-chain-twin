            t.textContent = k === 0 ? "0" : (k > 0 ? "+" : "−") + Math.abs(k) + "k";
          });
          // the gate's floor (0.5% of the plan in hand) per round
          WALK.steps.forEach((s) => {
            const f = (-0.005 * s.incumbent_cost) / 1000;
            mk("rect", { x: X(s.round) - colW / 2 + 6, y: Y(0), width: colW - 12, height: Y(f) - Y(0), fill: "rgba(242,196,109,0.22)", class: "running-grid" });
          });
          WALK.steps.forEach((s) => {
            const t = mk("text", { x: X(s.round), y: PX.b + 36, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace", "font-size": 20, fill: "#8494a6", class: "running-grid" });
            t.textContent = "round " + s.round;
          });
          // candidate dots
          const byRound = {};
          WALK.candidates.forEach((c) => (byRound[c.round] = byRound[c.round] || []).push(c));
          let off = 0;
          const dots = {};
          Object.entries(byRound).forEach(([r, cs]) => {
            dots[r] = cs.map((c, k) => {
              const x = X(+r) + (k - (cs.length - 1) / 2) * 11;
              const v = c.diff / 1000;
              let el;
              if (v > YMAX) {
                off += 1;
                el = mk("path", { d: "M" + (x - 7) + " " + (PX.t + 8) + "h14l-7 -12z", fill: "#8494a6", opacity: 0 });
              } else if (c.chosen) {
                el = mk("circle", { cx: x, cy: Y(v), r: 12, fill: "#3fd8a8", stroke: "#0a1119", "stroke-width": 3, opacity: 0 });
              } else if (c.accepted) {
                el = mk("circle", { cx: x, cy: Y(v), r: 8, fill: "#0b1722", stroke: "#3fd8a8", "stroke-width": 3, opacity: 0 });
              } else {
                el = mk("circle", { cx: x, cy: Y(v), r: 7, fill: "rgba(178,191,204,0.5)", opacity: 0 });
              }
              return { el, c };
            });
          });
          document.getElementById("running-note").textContent =
            "Each dot: one candidate tested against the plan in hand (" + WALK.candidates_tested + " in all). ▲ = " + off + " far costlier ones, off the chart.";
          // side list
          const rowsEl = document.getElementById("running-rows");
          WALK.steps.forEach((s, i) => {
            const ch = WALK.candidates.find((c) => c.round === s.round && c.chosen);
            rowsEl.insertAdjacentHTML("beforeend", '<div class="rw' + (ch ? "" : " stop") + '" id="running-rw' + i + '"><span>' + s.round + " · " + nice(s.chosen) + "</span>" +
              (ch ? "<b>" + sgn(ch.diff) + "</b>" : "<span>stop</span>") + "</div>");
          });
          const H = WALK.holdout, after = H.baseline_cost + H.cost_diff;
          document.getElementById("running-h-label").textContent = "HOLD-OUT · " + H.n_seeds + " NEW SEEDS · PROMOTION QUARTER";
          document.getElementById("running-h-plan").textContent = "searched plan: " + WALK.final;
          document.getElementById("running-h-badge").textContent = "−" + (Math.abs(H.cost_diff / H.baseline_cost) * 100).toFixed(1) + "%";
          document.getElementById("running-c1").textContent = "fill " + (H.fill_diff_pts < 0 ? "−" : "+") + Math.abs(H.fill_diff_pts).toFixed(2) + " pts";
          document.getElementById("running-c2").textContent = "truck use +" + H.util_diff_pts.toFixed(1) + " pts";

          // ---------------- choreography ----------------
          tl.fromTo("#running-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#running-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#running-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#running-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
          tl.fromTo("#running-chart", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          tl.fromTo(".running-grid", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);
          tl.fromTo("#running-side", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          tl.fromTo("#running-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);
          const big = document.getElementById("running-big");
          const cost = { v: WALK.steps[0].incumbent_cost };
          let last = cost.v;
          WALK.steps.forEach((s, i) => {
            const at = 1.3 + i * 0.72;
            dots[s.round].forEach((d, k) => tl.fromTo(d.el, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, at + k * 0.035));
            const chosen = dots[s.round].find((d) => d.c.chosen);
            if (chosen) tl.fromTo(chosen.el, { attr: { r: 22 } }, { attr: { r: 12 }, duration: 0.45, ease: "power2.out" }, at + 0.4);
            tl.fromTo("#running-rw" + i, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, at + 0.4);
            const next = i + 1 < WALK.steps.length ? WALK.steps[i + 1].incumbent_cost : last;
            if (chosen) tl.to(cost, { v: next, duration: 0.5, ease: "power2.out", onUpdate: () => { big.textContent = fmt(cost.v); } }, at + 0.4);
            last = next;
          });
          // phase 2: hold-out confirmation on seeds the search never saw
          const P2 = 8.3;
          tl.to("#running-a", { opacity: 0.12, scale: 0.97, duration: 0.6, ease: "power2.inOut" }, P2);
          tl.to(["#running-title", "#running-legend"], { opacity: 0, duration: 0.3 }, P2);
          tl.fromTo("#running-hold", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, P2 + 0.2);
          const hn = document.getElementById("running-h-num");
          const hv = { v: H.baseline_cost };
          hn.textContent = fmt(H.baseline_cost);
          tl.to(hv, { v: after, duration: 2.6, ease: "power2.inOut", onUpdate: () => { hn.textContent = fmt(hv.v); } }, P2 + 0.9);
          tl.fromTo("#running-h-bar", { scaleX: 1 }, { scaleX: after / H.baseline_cost, duration: 2.6, ease: "power2.inOut" }, P2 + 0.9);
          tl.fromTo("#running-h-badge", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, P2 + 3.5);
          ["#running-c1", "#running-c2", "#running-c3"].forEach((c, i) =>
            tl.fromTo(c, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, P2 + 3.9 + i * 0.25));
          tl.to("#running-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["running"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
