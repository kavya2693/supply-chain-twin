  - {id: F-31, slides: ["05"], label: "Gate rule", shown: "accept if cost CI < −0.5% and fill loss < 0.2 pts", type: direct, source: "src/supply_twin/harness.py:29, :34, :76-86", key: "MIN_COST_GAIN_SHARE, FILL_NON_INFERIORITY", formula: "-",
