# Audit facts for the supply-chain-twin demo video.
# Read by docs/demo/source/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).
# Slides print negative numbers with a typographic minus (−); expect strings use the ASCII "-".

project:
  name: supply-chain-twin
  title: "supply-chain-twin: demo video audit report"
  repo_url: https://github.com/kavya2693/supply-chain-twin
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 90.6
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [simpy, pandas, numpy, scipy]
  regenerate:
    - "make run                                   # data/ + outputs/*.csv|json (about 2.5 min on 4 cores)"
    - "python3 docs/demo/source/tools/export_search_walk.py docs/demo/source/assets/search_walk.json"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_change_sheet.py docs/demo/source/assets/change_sheet.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/search_walk.json docs/demo/source/compositions/s04-running.html --name WALK"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/change_sheet.json docs/demo/source/compositions/value.html --name SHEET"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/supply-chain-twin-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/supply-chain-twin-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_generator: 7, search_seeds: "0-19", evaluation_seeds: "1000-1029", holdout_seeds: "5000-5029"}
  run_time: "outputs/run_log.txt: make run 2:26.26 total (about 2.4 min) on the author's laptop; README says about 3 minutes on 4 cores"

assumptions:
  - id: A-01
    statement: "All data is synthetic, written by a seeded generator (seed 7) shaped like the three source systems: 28 trucks, 120 SKUs, 36 stores, 2 DCs, two years of daily order lines with 4% annual growth, holidays and category promotions. The production data it mirrors is proprietary."
    source: "scripts/generate_data.py:151 (generate, seed=7), :110 (4% growth); README 'The data'"
    figures: [F-03, F-04, F-05, F-06, F-07, F-08]
    all_figures: true
    edit: ["scripts/generate_data.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "Acceptance floor: a change is accepted only if the whole 95% interval of its total-cost change lies below -0.5% of baseline cost. The 0.5% is a judgement set from the twin's -3.3% demand bias, not a statistical result."
    source: "src/supply_twin/harness.py:34 (MIN_COST_GAIN_SHARE = 0.005); docs/adr/0001 'Alternatives rejected'"
    figures: [F-14, F-15, F-16, F-31, F-36, F-37, F-39, F-46, F-47, F-48]
    edit: ["src/supply_twin/harness.py:34"]
    rerun: ["make run", "export_search_walk.py + export_change_sheet.py + inject_sheet.py"]
  - id: A-03
    statement: "Fill non-inferiority: a change may lose at most 0.2 points of fill rate (lower bound of the fill-change interval)."
    source: "src/supply_twin/harness.py:29 (FILL_NON_INFERIORITY = 0.002)"
    figures: [F-31, F-36, F-37, F-46, F-47, F-57, F-58, F-59, F-60]
    edit: ["src/supply_twin/harness.py:29"]
    rerun: ["make run"]
  - id: A-04
    statement: "Seeds: the search uses 20 seeds (0-19) with a Bonferroni split of alpha per round; the evaluation table uses 30 seeds (1000-1029); the searched plan is confirmed on 30 hold-out seeds (5000-5029) the search never saw."
    source: "src/supply_twin/cli.py:189-191, :207-209; agent.py:110"
    figures: [F-09, F-12, F-32, F-40, F-41, F-42, F-43, F-44, F-51]
    edit: ["src/supply_twin/cli.py:189-191"]
    rerun: ["make run"]
  - id: A-05
    statement: "Cost constants are stated, not estimated: holding 25% a year, backroom overflow 1.0 per case-day, driver 28 per hour, trucks at 50 km/h, fleet daily fixed cost from the fleet file. Changing the overflow price changes which review period wins."
    source: "src/supply_twin/sim.py:29-34; README 'Known limitations'"
    figures: [F-14, F-36, F-37, F-39, F-41, F-42, F-46, F-48, F-53, F-54, F-57, F-58, F-59]
    edit: ["src/supply_twin/sim.py:29-34"]
    rerun: ["make run", "export_search_walk.py + export_change_sheet.py + inject_sheet.py"]
  - id: A-06
    statement: "Scenarios: a 91-day horizon; the promotion quarter puts beverages and snacks on a 14-day promotion from day 35; the outage scenario takes 20% of each DC's trucks out of service for the whole quarter."
    source: "src/supply_twin/sim.py:60-64, :73-74"
    figures: [F-09, F-26, F-35, F-59]
    edit: ["src/supply_twin/sim.py:60-74"]
    rerun: ["make run"]
  - id: A-07
    statement: "Simulated demand carries the store-SKU error spread measured in the 13-week backtest (sigma 0.104), so the simulated customers are as unpredictable as the history showed."
    source: "src/supply_twin/fidelity.py:37 (holdout_days=91), :80-89 (rate_error_sigma); cli.py:202-204"
    figures: [F-10, F-23, F-24, F-25, F-56]
    edit: ["src/supply_twin/fidelity.py"]
    rerun: ["make run"]
  - id: A-08
    statement: "The neighbour proposer moves one lever one grid step at a time (z, review days, cover days, fleet size, promotion awareness); the search stops when a round accepts nothing (here after 8 rounds)."
    source: "src/supply_twin/agent.py:23-29 (GRID), :49-63 (NeighbourProposer), :105-121 (search)"
    figures: [F-13, F-33, F-36, F-37, F-45]
    edit: ["src/supply_twin/agent.py:23-29"]
    rerun: ["make run"]
  - id: A-09
    statement: "Video rounding: money to whole units with thousands separators, percentages to 1 decimal (fill rates to 2), points to 2 decimals; '3.1M', '~2.5 min' and '≈0.1-0.2 s' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-06, F-10, F-14, F-24, F-34, F-42, F-49, F-50, F-53, F-56]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-10
    statement: "Slide 01 (industry, everyday problems) is general retail-planning knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 1, 2 and 4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: grocery & convenience chains, retail DCs & store networks, regional delivery fleets", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (rules tried on real stores; separate systems; promotion spikes; spreadsheet savings ignore breakdowns)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem', 'Why it is hard'", key: "README lines 9-31", formula: "-",
     check: {expr: "grep('README.md', r'quarter of empty shelves') and grep('README.md', r'three systems that were never') and grep('README.md', r'a full fleet, no breakdowns')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "10"], label: "Distribution centres", shown: "2 DCs", type: direct, source: "data/mms_locations.csv", key: "distinct dc_id", formula: "-",
     check: {expr: "R('data/mms_locations.csv')['dc_id'].nunique()", fmt: "{:d}", expect: "2"}}
  - {id: F-04, slides: ["02", "05", "08", "10"], label: "Stores", shown: "36 stores", type: direct, source: "outputs/data_quality.json", key: "stores", formula: "-",
     check: {expr: "J('outputs/data_quality.json')['stores']", fmt: "{:d}", expect: "36"}}
  - {id: F-05, slides: ["02", "10"], label: "Dispatchable trucks after repair", shown: "26 trucks", type: direct, source: "outputs/data_quality.json", key: "trucks_dispatchable", formula: "28 in source - 2 not dispatchable",
     check: {expr: "J('outputs/data_quality.json')['trucks_dispatchable']", fmt: "{:d}", expect: "26"}}
  - {id: F-06, slides: ["02", "05"], label: "Order lines", shown: "3.1M order lines", type: derived, source: "outputs/data_quality.json", key: "order_lines = 3,126,764", formula: "3,126,764 / 1e6, 1 decimal",
     check: {expr: "J('outputs/data_quality.json')['order_lines'] / 1e6", fmt: "{:.1f}M", expect: "3.1M"}}
  - {id: F-07, slides: ["02", "05"], label: "History length", shown: "2 years", type: direct, source: "src/supply_twin/calendar.py:12", key: "HISTORY_DAYS = 731 (2024-01-01..2025-12-31)", formula: "-",
     check: {expr: "grep('src/supply_twin/calendar.py', r'HISTORY_DAYS = 731')", fmt: bool}}
  - {id: F-08, slides: ["02", "05"], label: "SKUs and categories", shown: "120 SKUs in 8 categories", type: direct, source: "data/mms_items.csv; outputs/data_quality.json", key: "skus; distinct category", formula: "-",
     check: {expr: "J('outputs/data_quality.json')['skus'] == 120 and R('data/mms_items.csv')['category'].nunique() == 8", fmt: bool}}
  - {id: F-09, slides: ["02"], label: "Quarter length and seeds per strategy", shown: "91-day quarter × 30 paired seeds", type: direct, source: "src/supply_twin/sim.py:60; outputs/strategy_table.csv", key: "horizon_days = 91; n_seeds", formula: "-",
     check: {expr: "grep('src/supply_twin/sim.py', r'horizon_days: int = 91') and set(R('outputs/strategy_table.csv')['n_seeds']) == {30}", fmt: bool}}
  - {id: F-10, slides: ["02", "04"], label: "Twin demand bias in the backtest", shown: "the twin itself is 3.3% low / −3.3% demand bias", type: direct, source: "outputs/fidelity.json", key: "bias.twin = -0.0327", formula: "x 100, 1 decimal",
     check: {expr: "J('outputs/fidelity.json')['bias']['twin'] * 100", fmt: "{:.1f}%", expect: "-3.3%"}}
  # ---- slide 03
  - {id: F-11, slides: ["03"], label: "Flow blocks map to the code (sources, twin, propose, simulate, fair test, decision)", shown: "SOURCE DATA → DIGITAL TWIN → PROPOSE → SIMULATE → FAIR TEST → DECISION", type: direct, source: "src/supply_twin/", key: "load_sources, build_twin, NeighbourProposer.propose, simulate, Evaluator.compare, search", formula: "-",
     check: {expr: "all(grep('src/supply_twin/' + f, p) for f, p in [('twin.py', r'def load_sources'), ('twin.py', r'def build_twin'), ('agent.py', r'class NeighbourProposer'), ('sim.py', r'def simulate'), ('harness.py', r'def compare'), ('agent.py', r'def search')])", fmt: bool}}
  - {id: F-12, slides: ["03"], label: "Decision badges: cheaper than today; re-tested on new days (hold-out seeds); weak spots shown (robustness table)", shown: "✓ cheaper than today ✓ re-tested on new days ✓ weak spots shown", type: derived, source: "outputs/search_neighbour_promo.json; outputs/search_neighbour_promo_robustness.csv", key: "holdout.cost_diff < 0; holdout.n_seeds = 30; any robustness row not accepted", formula: "-",
     check: {expr: "(lambda j, r: j['holdout']['cost_diff'] < 0 and j['holdout']['n_seeds'] == 30 and (~r['accepted']).any())(J('outputs/search_neighbour_promo.json'), R('outputs/search_neighbour_promo_robustness.csv'))", fmt: bool}}
  - {id: F-13, slides: ["03"], label: "Search loop repeats until nothing wins", shown: "until nothing wins", type: direct, source: "outputs/search_neighbour_promo.csv; agent.py:118-119", key: "last round has 0 accepted candidates", formula: "-",
     check: {expr: "(lambda d: int(d[d['round'] == d['round'].max()]['accepted'].sum()) == 0)(R('outputs/search_neighbour_promo.csv'))", fmt: bool}}
  # ---- slide 04
  - {id: F-14, slides: ["04"], label: "Three real candidate intervals, cost change as % of the plan in hand (mean, low, high)", shown: "Less stock cover (crosses 0) · Promotion-aware ordering (below 0, above floor) · Two fewer trucks (clears floor)", type: derived, source: "outputs/search_neighbour_promo.csv", key: "round 1 cover=0.5d: +0.139 (-0.078..+0.355); round 3 promo_aware=yes: -0.516 (-0.785..-0.247); round 2 trucks-2: -2.169 (-2.385..-1.954)", formula: "cost_diff{,_low,_high} / baseline_cost x 100, 3 decimals; must equal the IV array in compositions/explainer.html",
     check: {expr: "intervals_match()", fmt: bool}}
  - {id: F-15, slides: ["04"], label: "Verdicts: noise / real but inside twin error / clears the floor (the middle one is statistically significant yet rejected)", shown: "✗ could be noise · ✗ real, but inside twin error · ✓ clears the floor", type: derived, source: "outputs/search_neighbour_promo.csv", key: "accepted, p_value vs alpha", formula: "A: p >= alpha, not accepted; B: p < alpha, not accepted, fill ok; C: accepted",
     check: {expr: "verdicts_match()", fmt: bool}}
  - {id: F-16, slides: ["04", "05", "06"], label: "Floor = 0.5% of quarterly cost", shown: "Floor = 0.5% of quarterly cost / cost CI < −0.5% / floor −0.5%", type: direct, source: "src/supply_twin/harness.py:34", key: "MIN_COST_GAIN_SHARE = 0.005", formula: "-",
     check: {expr: "grep('src/supply_twin/harness.py', r'^MIN_COST_GAIN_SHARE = 0.005')", fmt: bool}}
  # ---- slide 05
  - {id: F-17, slides: ["05"], label: "Every architecture box names a real module / function", shown: "twin.py · TwinState · fidelity.py · sim.py · simulate() · harness.py · llm.py · agent.py · cli.py · load_sources()", type: direct, source: "src/supply_twin/", key: "classes and functions", formula: "-",
     check: {expr: "all(grep('src/supply_twin/' + f, p) for f, p in [('twin.py', r'class TwinState'), ('twin.py', r'def load_sources'), ('twin.py', r'def build_twin'), ('fidelity.py', r'def backtest'), ('sim.py', r'def simulate'), ('sim.py', r'^SCENARIOS = '), ('harness.py', r'self._cache'), ('harness.py', r'def compare'), ('llm.py', r'class LLMProposer'), ('agent.py', r'class NeighbourProposer'), ('cli.py', r'def cmd_robustness')])", fmt: bool}}
  - {id: F-18, slides: ["05"], label: "Trucks in the fleet file (before repair)", shown: "28 trucks", type: direct, source: "outputs/data_quality.json", key: "trucks_in_source", formula: "-",
     check: {expr: "J('outputs/data_quality.json')['trucks_in_source']", fmt: "{:d}", expect: "28"}}
  - {id: F-19, slides: ["05", "08"], label: "Store-SKU demand rates in the twin", shown: "4,320 store-SKU rates", type: derived, source: "outputs/data_quality.json", key: "stores x skus", formula: "36 x 120 = 4,320",
     check: {expr: "J('outputs/data_quality.json')['stores'] * J('outputs/data_quality.json')['skus']", fmt: "{:,d}", expect: "4,320"}}
  - {id: F-20, slides: ["05"], label: "Data-quality repairs are written to a file", shown: "Data quality · data_quality.json", type: direct, source: "src/supply_twin/cli.py:49", key: "_write_json(out / 'data_quality.json')", formula: "-",
     check: {expr: "grep('src/supply_twin/cli.py', r'data_quality.json')", fmt: bool}}
  - {id: F-21, slides: ["05"], label: "The bus reads 4 CSV files", shown: "load_sources() · 4 CSV files", type: direct, source: "src/supply_twin/twin.py:74-80", key: "four read_csv calls", formula: "-",
     check: {expr: "len(re.findall(r'pd.read_csv', T('src/supply_twin/twin.py'))) == 4", fmt: bool}}
  - {id: F-22, slides: ["05"], label: "Backtest length", shown: "Backtest · 13 weeks", type: derived, source: "outputs/fidelity.json", key: "holdout_days = 91", formula: "91 / 7 = 13",
     check: {expr: "J('outputs/fidelity.json')['holdout_days'] // 7", fmt: "{:d}", expect: "13"}}
  - {id: F-23, slides: ["05", "08"], label: "Twin weekly store x SKU WAPE", shown: "WAPE 17.8% / 17.8%", type: direct, source: "outputs/fidelity.json", key: "wape_store_sku_week.twin", formula: "x 100",
