     check: {expr: "(lambda m: round((int(m.group(1)) * 60 + float(m.group(2))) / 60 * 2) / 2)(re.search(r'(\\d+):(\\d+\\.\\d+) total', T('outputs/run_log.txt')))", fmt: "{:.1f} min", expect: "2.5 min"}}
  - {id: F-35, slides: ["05"], label: "Three scenarios", shown: "3 scenarios · base · promo · outage", type: direct, source: "src/supply_twin/sim.py:71-75", key: "SCENARIOS keys base, promo, fleet_outage", formula: "-",
     check: {expr: "set(R('outputs/strategy_table.csv')['scenario']) == {'base', 'promo', 'fleet_outage'}", fmt: bool}}
  # ---- slide 06
  - {id: F-36, slides: ["06"], label: "Every dot = one tested candidate (round, cost change vs the plan in hand, accepted, chosen); 6 off the chart above +320k", shown: "71 candidates over 8 rounds; ▲ = 6 far costlier ones", type: direct, source: "outputs/search_neighbour_promo.csv → demo assets/search_walk.json, injected into compositions/s04-running.html", key: "round, cost_diff, accepted, chosen", formula: "dot y = cost_diff / 1000 (k); off-chart if > 320k",
     check: {expr: "walk_matches() and int((R('outputs/search_neighbour_promo.csv')['cost_diff'] > 320000).sum()) == 6", fmt: bool}}
