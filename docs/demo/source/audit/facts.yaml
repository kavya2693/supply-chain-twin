     check: {expr: "J('outputs/search_neighbour_promo.json')['simulation_runs_total']", fmt: "{:,d}", expect: "1,930"}}
  - {id: F-29, slides: ["05"], label: "Process pool size", shown: "pool ≤ 4", type: direct, source: "src/supply_twin/harness.py:107", key: "min(4, os.cpu_count())", formula: "-",
     check: {expr: "grep('src/supply_twin/harness.py', r'min\\(4, os.cpu_count\\(\\) or 1\\)')", fmt: bool}}
  - {id: F-30, slides: ["05"], label: "LLM call timeout", shown: "180 s timeout", type: direct, source: "src/supply_twin/llm.py:25", key: "timeout: float = 180", formula: "-",
