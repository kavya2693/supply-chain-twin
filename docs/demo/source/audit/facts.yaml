     check: {expr: "J('outputs/search_neighbour_promo.json')['holdout']['n_seeds'] == 30 and len(R('outputs/search_neighbour_promo_robustness.csv')) == 3", fmt: bool}}
  - {id: F-33, slides: ["05"], label: "Gate counter at the end of the loop", shown: "round 8 · 71 tested (counts up through rounds 1-8)", type: direct, source: "outputs/search_neighbour_promo.csv / .json", key: "rounds, candidates_tested, cumulative per round", formula: "cumulative tested per round = 8, 17, 26, 35, 44, 53, 62, 71",
     check: {expr: "list(R('outputs/search_neighbour_promo.csv').groupby('round').size().cumsum()) == [8, 17, 26, 35, 44, 53, 62, 71] and grep('demo:compositions/s03-architecture.html', r'\\[\\[8, 1\\], \\[17, 2\\], \\[26, 3\\], \\[35, 4\\], \\[44, 5\\], \\[53, 6\\], \\[62, 7\\], \\[71, 8\\]\\]')", fmt: bool}}
