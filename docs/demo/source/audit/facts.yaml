# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def _block(path, name):
      html = T(path)
      m = _re.search(r"const " + name + r" = (\{.*?\}); /\* " + name + r":END", html, _re.S)
      return json.loads(m.group(1))
  def walk_matches():
      """The WALK block in s04-running.html must equal the search log row by row."""
      w = _block('demo:compositions/s04-running.html', 'WALK')
      d = R('outputs/search_neighbour_promo.csv')
      if len(w['candidates']) != len(d) or w['candidates_tested'] != len(d):
          return False
      for c, (_, r) in zip(w['candidates'], d.iterrows()):
          if c['round'] != r['round'] or abs(c['diff'] - r['cost_diff']) > 0.01:
              return False
          if c['accepted'] != bool(r['accepted']) or c['chosen'] != bool(r['chosen']):
              return False
      h = J('outputs/search_neighbour_promo.json')['holdout']
      return abs(w['holdout']['cost_diff'] - h['cost_diff']) < 0.01 and w['holdout']['n_seeds'] == h['n_seeds']
  def _iv(rnd, cand):
      d = R('outputs/search_neighbour_promo.csv')
      r = d[(d['round'] == rnd) & (d['candidate'] == cand)].iloc[0]
      return r, [float(round(r[k] / r['baseline_cost'] * 100, 3)) for k in ('cost_diff_low', 'cost_diff', 'cost_diff_high')]
  _IV = [(1, 'z=1.28 review=1d cover=0.5d trucks+0 promo_aware=no'),
         (3, 'z=1.28 review=2d cover=1d trucks-2 promo_aware=yes'),
         (2, 'z=1.28 review=2d cover=1d trucks-2 promo_aware=no')]
  def intervals_match():
      """The IV array in explainer.html must equal the three candidates' intervals (% of the plan in hand)."""
      html = T('demo:compositions/explainer.html')
      for rnd, cand in _IV:
          _, (lo, m, hi) = _iv(rnd, cand)
          if not _re.search(r"lo: %s, m: %s, hi: %s" % (repr(lo), repr(m), repr(hi)), html):
              return False
      return True
  def verdicts_match():
      a, _ = _iv(*_IV[0]); b, _ = _iv(*_IV[1]); c, _ = _iv(*_IV[2])
      return (not a['accepted'] and a['p_value'] >= a['alpha'] and a['cost_diff_low'] < 0 < a['cost_diff_high']
              and not b['accepted'] and b['p_value'] < b['alpha'] and b['cost_diff_high'] < 0 and b['fill_diff_low_pts'] > -0.2
              and bool(c['accepted']))
  def sheet_matches():
      """The SHEET block in value.html must equal outputs/strategy_table.csv for the promotion quarter."""
      s = _block('demo:compositions/value.html', 'SHEET')
      t = R('outputs/strategy_table.csv')
      t = t[t['scenario'] == 'promo'].set_index('strategy')
      if len(s['rows']) != len(t):
          return False
      for r in s['rows']:
          x = t.loc[r['strategy']]
          for a, b in [('total_cost', 'total_cost'), ('cost_vs_current', 'cost_vs_current'), ('cost_vs_current_ci_half', 'cost_vs_current_ci_half'),
                       ('fill_rate', 'fill_rate'), ('promo_fill_rate', 'promo_fill_rate'), ('load_fill', 'load_fill')]:
              if abs(r[a] - x[b]) > 1e-6 * max(1.0, abs(x[b])):
                  return False
          if r['beats_current'] != bool(x['beats_current']):
              return False
      return s['n_seeds'] == 30
  def stores_match():
      s = _block('demo:compositions/value.html', 'SHEET')['stores']
      loc = R('data/mms_locations.csv')
      return len(s) == len(loc) == 36 and all(
          a['store'] == b['store_id'] and a['dc'] == b['dc_id'] and abs(a['km'] - b['distance_km']) < 1e-9 and a['index'] == i
          for i, (a, (_, b)) in enumerate(zip(s, loc.iterrows())))
