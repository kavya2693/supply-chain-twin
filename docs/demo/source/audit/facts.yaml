      - "High service 2,616,577 +156,497 ±2,984 99.96% 99.51% ✗ NO"
      - "✓ 3 of 6 changes clear the gate · best: order every 2 days, −142,008 a quarter"
      - "PLANNER · PICKS A CHANGE: Order every 2 days · ✓ GO −142,008 / quarter, 30 seeds"
      - "DCS → 36 STORES · NEXT QUARTER · DAY 1..4 · truck load fill 65% → 78% · promo fill (the trade-off) 98.4% → 96.8%"
      - "Each change arrives priced and checked before any store tries it. No quarter spent finding out."
    assumptions: [A-02, A-03, A-04, A-05, A-06]
    illustrative: ["Planner figure is a placeholder (no real person).", "Store angles around each DC are evenly spaced (the data has no coordinates); each store's distance from its DC is real.", "Purple trips and green dots replay the review stagger of 'order every 2 days' (which half of the stores orders each day); they are not simulated truck movements.", "'No quarter spent finding out' is framing from the README problem statement, not a measured result."]
    change: "Re-run tools/export_change_sheet.py, then tools/inject_sheet.py (--name SHEET); CONFIG.pick chooses the row the planner hands over."
