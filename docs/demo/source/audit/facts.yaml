  - {id: F-25, slides: ["05"], label: "Backtest bias on the backtest box", shown: "bias −3.3%", type: direct, source: "outputs/fidelity.json", key: "bias.twin", formula: "x 100",
     check: {expr: "J('outputs/fidelity.json')['bias']['twin'] * 100", fmt: "{:.1f}%", expect: "-3.3%"}}
  - {id: F-26, slides: ["05"], label: "Simulated day: 91 days, sales at 21:00, trucks 05:00-19:00", shown: "91 days · sell 21:00 · trucks 05–19 h", type: direct, source: "src/supply_twin/sim.py:27-28, :60", key: "SHIFT_START, SHIFT_END, SALES_HOUR, horizon_days", formula: "-",
     check: {expr: "grep('src/supply_twin/sim.py', r'SHIFT_START, SHIFT_END = 5.0, 19.0') and grep('src/supply_twin/sim.py', r'SALES_HOUR, REVIEW_HOUR = 21.0') and grep('src/supply_twin/sim.py', r'horizon_days: int = 91')", fmt: bool}}
  - {id: F-27, slides: ["05"], label: "Run time of one simulated quarter", shown: "≈0.1–0.2 s per simulated quarter", type: direct, source: "docs/adr/0001-paired-seeds-and-a-practical-floor-decide-strategies.md:21", key: "'runs in about 0.1-0.2 s'", formula: "-",
     check: {expr: "grep('docs/adr/0001-paired-seeds-and-a-practical-floor-decide-strategies.md', r'about 0.1-0.2 s')", fmt: bool}, note: "Stated in the ADR from the author's runs; not re-timed by this audit."}
